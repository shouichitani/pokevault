<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<title>PokeVault</title>
<link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@700;900&family=Noto+Sans+JP:wght@300;400;700&display=swap" rel="stylesheet">
<style>
:root {
  --bg: #0a0a0f; --surface: #12121a; --surface2: #1a1a28; --border: #2a2a40;
  --accent: #f7c948; --accent2: #e05c2a; --blue: #3a8ef6; --green: #2ecc71; --red: #e74c3c;
  --text: #e8e8f0; --muted: #7070a0;
}
* { box-sizing: border-box; margin: 0; padding: 0; }
body { background: var(--bg); color: var(--text); font-family: 'Noto Sans JP', sans-serif; min-height: 100vh; }
header { position: sticky; top: 0; z-index: 100; background: rgba(10,10,15,0.95); border-bottom: 1px solid var(--border); padding: 12px 16px; display: flex; align-items: center; justify-content: space-between; }
.logo { font-family: 'Orbitron', monospace; font-weight: 900; font-size: 1.1rem; letter-spacing: 2px; background: linear-gradient(135deg, var(--accent), var(--accent2)); -webkit-background-clip: text; -webkit-text-fill-color: transparent; }
.header-right { display: flex; align-items: center; gap: 12px; font-size: 0.75rem; color: var(--muted); }
.header-right strong { color: var(--accent); }
#settings-panel { background: var(--surface); border-bottom: 1px solid var(--border); padding: 16px; display: none; }
#settings-panel.open { display: block; }
.field { margin-bottom: 10px; }
.field label { display: block; font-size: 0.7rem; color: var(--muted); text-transform: uppercase; letter-spacing: 1px; margin-bottom: 4px; }
.field input { width: 100%; padding: 9px 12px; background: var(--surface2); border: 1px solid var(--border); border-radius: 6px; color: var(--text); font-size: 0.85rem; font-family: inherit; }
.field input:focus { outline: none; border-color: var(--accent); }
.btn-save { width: 100%; padding: 10px; background: var(--accent); color: #000; border: none; border-radius: 6px; font-weight: 700; cursor: pointer; font-size: 0.85rem; }
.tabs { display: flex; background: var(--surface); border-bottom: 1px solid var(--border); position: sticky; top: 57px; z-index: 90; }
.tab { flex: 1; padding: 13px 8px; background: none; border: none; border-bottom: 2px solid transparent; color: var(--muted); font-size: 0.8rem; cursor: pointer; font-family: inherit; display: flex; align-items: center; justify-content: center; gap: 5px; }
.tab.active { color: var(--accent); border-bottom-color: var(--accent); }
main { padding: 16px; max-width: 600px; margin: 0 auto; }
.scan-drop { background: var(--surface); border: 2px dashed var(--border); border-radius: 16px; min-height: 200px; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 10px; padding: 20px; }
.scan-drop .icon { font-size: 2.5rem; }
.scan-drop p { color: var(--muted); font-size: 0.85rem; text-align: center; }
#preview-img { width: 100%; max-height: 260px; object-fit: contain; border-radius: 8px; display: none; }
.scan-btns { display: flex; gap: 8px; margin-top: 10px; }
.scan-btns button { flex: 1; padding: 11px 8px; background: var(--surface2); border: 1px solid var(--border); color: var(--text); border-radius: 8px; cursor: pointer; font-family: inherit; font-size: 0.85rem; }
#file-input { display: none; }
.btn-analyze { width: 100%; padding: 14px; margin-top: 10px; background: linear-gradient(135deg, var(--accent), var(--accent2)); color: #000; border: none; border-radius: 10px; font-weight: 700; font-size: 1rem; cursor: pointer; font-family: 'Orbitron', monospace; letter-spacing: 1px; }
.btn-analyze:disabled { opacity: 0.4; cursor: not-allowed; }
.msg { padding: 10px 14px; border-radius: 8px; font-size: 0.85rem; margin-top: 10px; display: none; }
.msg.show { display: block; }
.msg.ok { background: rgba(46,204,113,0.15); color: var(--green); border: 1px solid rgba(46,204,113,0.3); }
.msg.err { background: rgba(231,76,60,0.15); color: var(--red); border: 1px solid rgba(231,76,60,0.3); }
.msg.info { background: rgba(58,142,246,0.15); color: var(--blue); border: 1px solid rgba(58,142,246,0.3); }
#result-box { background: var(--surface); border: 1px solid var(--border); border-radius: 12px; padding: 16px; margin-top: 14px; display: none; }
#result-box.show { display: block; }
.result-name { font-family: 'Orbitron', monospace; font-size: 1rem; margin-bottom: 10px; }
.result-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; margin-bottom: 10px; }
.rf { background: var(--surface2); padding: 8px 10px; border-radius: 6px; }
.rf .rl { font-size: 0.62rem; color: var(--muted); text-transform: uppercase; letter-spacing: 1px; }
.rf .rv { font-size: 0.88rem; font-weight: 700; margin-top: 2px; }
.result-notes { font-size: 0.8rem; color: var(--muted); line-height: 1.5; margin-bottom: 12px; }
.type-badge { display: inline-block; padding: 2px 10px; border-radius: 20px; font-size: 0.68rem; font-weight: 700; text-transform: uppercase; letter-spacing: 1px; margin-left: 8px; vertical-align: middle; }
.btn-reg { width: 100%; padding: 12px; background: var(--green); color: #fff; border: none; border-radius: 8px; font-weight: 700; cursor: pointer; font-size: 0.9rem; font-family: inherit; }
.btn-reg:disabled { opacity: 0.4; }
.t-fire{background:rgba(224,92,42,.25);color:#e05c2a} .t-water{background:rgba(58,142,246,.25);color:#3a8ef6}
.t-grass{background:rgba(46,204,113,.25);color:#2ecc71} .t-electric{background:rgba(247,201,72,.25);color:#f7c948}
.t-psychic{background:rgba(180,80,180,.25);color:#c060c0} .t-fighting{background:rgba(180,80,50,.25);color:#c05030}
.t-dark{background:rgba(80,60,100,.25);color:#9070b0} .t-dragon{background:rgba(50,80,200,.25);color:#4060d0}
.t-steel{background:rgba(150,150,180,.25);color:#a0a0c0} .t-normal,.t-colorless{background:rgba(160,160,160,.2);color:#a0a0b0}
.t-unknown{background:rgba(100,100,120,.2);color:var(--muted)}
.coll-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 12px; }
.coll-title { font-family: 'Orbitron', monospace; font-size: 0.9rem; color: var(--accent); }
.btn-refresh { padding: 6px 12px; background: var(--surface); border: 1px solid var(--border); color: var(--text); border-radius: 6px; cursor: pointer; font-size: 0.75rem; font-family: inherit; }
.card-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
.card-item { background: var(--surface); border: 1px solid var(--border); border-radius: 10px; padding: 12px; cursor: pointer; }
.card-item .cn { font-weight: 700; font-size: 0.88rem; margin-bottom: 4px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.card-item .cm { font-size: 0.7rem; color: var(--muted); margin-top: 3px; }
.empty { text-align: center; padding: 40px; color: var(--muted); grid-column: 1/-1; }
.empty .ei { font-size: 3rem; margin-bottom: 8px; }
.search-wrap { position: relative; margin-bottom: 14px; }
.search-wrap input { width: 100%; padding: 12px 12px 12px 38px; background: var(--surface); border: 1px solid var(--border); border-radius: 10px; color: var(--text); font-size: 0.9rem; font-family: inherit; }
.search-wrap input:focus { outline: none; border-color: var(--accent); }
.search-icon { position: absolute; left: 12px; top: 50%; transform: translateY(-50%); color: var(--muted); pointer-events: none; }
#overlay { position: fixed; inset: 0; background: rgba(0,0,0,0.8); z-index: 200; display: none; align-items: center; justify-content: center; padding: 16px; }
#overlay.open { display: flex; }
.modal { background: var(--surface); border: 1px solid var(--border); border-radius: 16px; padding: 20px; width: 100%; max-width: 400px; max-height: 85vh; overflow-y: auto; }
.modal-head { display: flex; justify-content: space-between; align-items: center; margin-bottom: 14px; }
.modal-title { font-family: 'Orbitron', monospace; font-size: 0.9rem; color: var(--accent); }
.modal-close { background: none; border: none; color: var(--muted); font-size: 1.4rem; cursor: pointer; }
.modal img { width: 100%; border-radius: 10px; margin-bottom: 12px; }
.btn-del { width: 100%; padding: 10px; background: rgba(231,76,60,.15); color: var(--red); border: 1px solid rgba(231,76,60,.3); border-radius: 8px; cursor: pointer; font-size: 0.85rem; font-family: inherit; margin-top: 8px; }
.spinner { display: inline-block; width: 16px; height: 16px; border: 2px solid rgba(0,0,0,0.3); border-top-color: #000; border-radius: 50%; animation: spin 0.7s linear infinite; vertical-align: middle; margin-right: 6px; }
@keyframes spin { to { transform: rotate(360deg); } }
#view-collection, #view-search { display: none; }
#batch-result.show { display: block !important; }
.batch-item { display: flex; align-items: center; gap: 8px; padding: 8px 10px; background: var(--surface2); border-radius: 6px; font-size: 0.8rem; }
.batch-num { color: var(--muted); font-family: monospace; font-size: 0.75rem; min-width: 38px; }
.batch-name { flex: 1; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; font-weight: 700; }
.batch-status { font-size: 0.75rem; white-space: nowrap; }
.help-text { font-size: 0.7rem; color: var(--muted); margin-top: 4px; line-height: 1.5; }
</style>
</head>
<body>

<header>
  <div class="logo">⚡ POKEVAULT <span style="font-size:0.55rem;color:var(--muted);letter-spacing:1px;-webkit-text-fill-color:var(--muted)">v5.0.2</span></div>
  <div class="header-right">
    <span>コレクション: <strong id="total">0</strong>枚</span>
    <button onclick="toggleSettings()" style="background:none;border:none;color:var(--muted);cursor:pointer;font-size:1.1rem">⚙️</button>
  </div>
</header>

<div id="settings-panel">
  <div class="field">
    <label>Gemini API Key（無料）<a href="https://aistudio.google.com/app/apikey" target="_blank" style="color:var(--accent);font-size:0.65rem;margin-left:6px">→ 取得</a></label>
    <input type="password" id="s-gemini" placeholder="AIza...">
  </div>
  <div class="field">
    <label>Dropbox App Key<a href="https://www.dropbox.com/developers/apps" target="_blank" style="color:var(--accent);font-size:0.65rem;margin-left:6px">→ アプリ設定</a></label>
    <input type="text" id="s-dbx-key" placeholder="App keyを入力">
  </div>
  <div class="field">
    <label>Dropbox App Secret</label>
    <input type="password" id="s-dbx-secret" placeholder="App secretを入力">
  </div>
  <div class="field" id="dbx-auth-field" style="display:none">
    <label>Dropbox 認証コード</label>
    <input type="text" id="s-dbx-code" placeholder="認証画面で取得したコード">
    <button onclick="completeDropboxAuth()" style="width:100%;padding:8px;background:var(--blue);color:#fff;border:none;border-radius:6px;margin-top:6px;font-weight:700;cursor:pointer;font-family:inherit;font-size:0.8rem">✅ 認証コードを使ってトークン取得</button>
  </div>
  <div class="field">
    <button onclick="startDropboxAuth()" style="width:100%;padding:10px;background:var(--blue);color:#fff;border:none;border-radius:6px;font-weight:700;cursor:pointer;font-family:inherit;font-size:0.85rem">🔗 Dropbox連携を開始</button>
    <div class="help-text" id="dbx-status">未連携</div>
  </div>
  <button class="btn-save" onclick="saveSettings()">💾 保存</button>
  <div id="s-msg" class="msg"></div>
</div>

<nav class="tabs">
  <button class="tab active" onclick="showTab('scan',this)">📷 スキャン</button>
  <button class="tab" onclick="showTab('collection',this)">📦 コレクション</button>
  <button class="tab" onclick="showTab('search',this)">🔍 検索</button>
</nav>

<main>
  <div id="view-scan">
    <div class="scan-drop">
      <div id="drop-icon" class="icon">🎴</div>
      <p id="drop-text">下のボタンでカードを撮影・選択</p>
      <img id="preview-img" alt="preview">
    </div>
    <div class="scan-btns">
      <button onclick="openCamera()">📷 カメラで撮影</button>
      <button onclick="openGallery()">🖼 ギャラリー</button>
    </div>
    <input type="file" id="file-input" accept="image/*" multiple>
    <button class="btn-analyze" id="btn-analyze" onclick="analyze()" disabled>🔍 AIで解析する</button>
    <div id="scan-msg" class="msg"></div>
    <div id="batch-result" style="background:var(--surface);border:1px solid var(--border);border-radius:12px;padding:14px;margin-top:14px;display:none">
      <div style="font-family:'Orbitron',monospace;font-size:0.9rem;color:var(--accent);margin-bottom:10px">🎴 一括処理結果</div>
      <div id="batch-list" style="display:flex;flex-direction:column;gap:6px;max-height:400px;overflow-y:auto"></div>
    </div>
    <div id="result-box">
      <div class="result-name" id="r-name"></div>
      <div class="result-grid">
        <div class="rf"><div class="rl">HP</div><div class="rv" id="r-hp">—</div></div>
        <div class="rf"><div class="rl">レアリティ</div><div class="rv" id="r-rarity">—</div></div>
        <div class="rf"><div class="rl">収録セット</div><div class="rv" id="r-set">—</div></div>
        <div class="rf"><div class="rl">カードNo.</div><div class="rv" id="r-number">—</div></div>
      </div>
      <div class="rf" style="background:linear-gradient(135deg,rgba(247,201,72,0.12),rgba(224,92,42,0.12));border:1px solid rgba(247,201,72,0.3);margin-bottom:10px"><div class="rl">💰 参考売却価格（市場検索）</div><div class="rv" id="r-price" style="font-size:1.05rem;color:var(--accent)">検索中...</div><div id="r-price-note" style="font-size:0.65rem;color:var(--muted);margin-top:4px;line-height:1.4"></div></div>
      <div class="result-notes" id="r-notes"></div>
      <button class="btn-reg" id="btn-reg" onclick="registerCard()">📦 Dropboxに保存する</button>
      <div id="reg-msg" class="msg"></div>
    </div>
  </div>

  <div id="view-collection">
    <div class="coll-header">
      <div class="coll-title">MY COLLECTION</div>
      <button class="btn-refresh" onclick="loadCollection()">↻ 更新</button>
    </div>
    <div id="total-value" style="background:linear-gradient(135deg,rgba(247,201,72,0.12),rgba(224,92,42,0.12));border:1px solid rgba(247,201,72,0.3);border-radius:10px;padding:12px 16px;margin-bottom:14px;display:none">
      <div style="font-size:0.7rem;color:var(--muted);text-transform:uppercase;letter-spacing:1px;margin-bottom:4px">💰 コレクション総額</div>
      <div id="total-value-amount" style="font-family:'Orbitron',monospace;font-size:1.4rem;font-weight:700;color:var(--accent)">¥0</div>
      <div id="total-value-note" style="font-size:0.65rem;color:var(--muted);margin-top:3px"></div>
    </div>
    <div id="card-grid" class="card-grid"><div class="empty"><div class="ei">📦</div><p>コレクションタブで読み込みます</p></div></div>
  </div>

  <div id="view-search">
    <div class="search-wrap">
      <span class="search-icon">🔍</span>
      <input placeholder="カード名・タイプで検索..." oninput="searchCards(this.value)">
    </div>
    <div id="search-results" class="card-grid"></div>
  </div>
</main>

<div id="overlay" onclick="closeModal(event)">
  <div class="modal">
    <div class="modal-head">
      <div class="modal-title" id="m-name"></div>
      <button class="modal-close" onclick="closeModal()">✕</button>
    </div>
    <img id="m-img" src="" alt="">
    <div class="result-grid" id="m-fields"></div>
    <div style="font-size:0.8rem;color:var(--muted);margin:8px 0;line-height:1.5" id="m-notes"></div>
    <div style="font-size:0.7rem;color:var(--muted)" id="m-date"></div>
    <div id="m-msg" class="msg"></div>
    <button id="btn-reanalyze" onclick="reanalyzeCard()" style="width:100%;padding:10px;background:var(--blue);color:#fff;border:none;border-radius:8px;cursor:pointer;font-size:0.85rem;font-family:inherit;margin-top:8px;font-weight:700">🔄 価格を再取得</button>
    <button class="btn-del" onclick="deleteCard()">🗑️ このカードを削除</button>
  </div>
</div>

<script>
let selectedFile = null, selectedB64 = null, analyzedCard = null, collection = [], modalCard = null;
const TL = {fire:'炎',water:'水',grass:'草',electric:'雷',psychic:'超',fighting:'闘',dark:'悪',dragon:'竜',steel:'鋼',normal:'無',colorless:'無'};
const DBX_API = 'https://api.dropboxapi.com/2';
const DBX_CONTENT = 'https://content.dropboxapi.com/2';
const DBX_AUTH = 'https://api.dropboxapi.com/oauth2/token';

// ===== Dropbox OAuth 認証フロー =====
function startDropboxAuth() {
  const appKey = document.getElementById('s-dbx-key').value.trim();
  if (!appKey) {
    showMsg('s-msg', '⚠️ App Keyを先に入力してください', 'err');
    return;
  }
  localStorage.setItem('pv_dbx-key', appKey);
  // App Secretも一応保存
  const secret = document.getElementById('s-dbx-secret').value.trim();
  if (secret) localStorage.setItem('pv_dbx-secret', secret);
  // 認証画面を新規タブで開く
  const authUrl = `https://www.dropbox.com/oauth2/authorize?client_id=${appKey}&response_type=code&token_access_type=offline`;
  window.open(authUrl, '_blank');
  // 認証コード入力フィールドを表示
  document.getElementById('dbx-auth-field').style.display = 'block';
  showMsg('s-msg', '📋 認証画面でコードを取得して下の欄に貼り付けてください', 'info');
}

async function completeDropboxAuth() {
  const appKey = cfg('dbx-key');
  const appSecret = cfg('dbx-secret');
  const code = document.getElementById('s-dbx-code').value.trim();
  if (!appKey || !appSecret || !code) {
    showMsg('s-msg', '⚠️ App Key, App Secret, 認証コードが必要です', 'err');
    return;
  }
  try {
    const params = new URLSearchParams();
    params.append('code', code);
    params.append('grant_type', 'authorization_code');
    params.append('client_id', appKey);
    params.append('client_secret', appSecret);
    const res = await fetch(DBX_AUTH, {
      method: 'POST',
      headers: { 'Content-Type': 'application/x-www-form-urlencoded' },
      body: params.toString()
    });
    if (!res.ok) {
      const err = await res.text();
      throw new Error(res.status + ': ' + err.slice(0, 200));
    }
    const data = await res.json();
    localStorage.setItem('pv_dbx-refresh', data.refresh_token);
    localStorage.setItem('pv_dbx-access', data.access_token);
    localStorage.setItem('pv_dbx-expires', String(Date.now() + (data.expires_in || 14400) * 1000));
    showMsg('s-msg', '✅ Dropbox連携が完了しました！', 'ok');
    document.getElementById('dbx-auth-field').style.display = 'none';
    document.getElementById('s-dbx-code').value = '';
    updateDbxStatus();
  } catch(e) {
    showMsg('s-msg', '❌ 認証失敗: ' + e.message, 'err');
  }
}

// アクセストークンを取得（必要なら自動更新）
async function getDbxAccessToken() {
  const refresh = localStorage.getItem('pv_dbx-refresh');
  if (!refresh) throw new Error('Dropbox未連携です。設定から連携してください');
  const expires = parseInt(localStorage.getItem('pv_dbx-expires') || '0');
  const access = localStorage.getItem('pv_dbx-access');
  // 期限まで5分以上ある場合はそのまま使う
  if (access && expires > Date.now() + 5*60*1000) {
    return access;
  }
  // リフレッシュ
  const appKey = cfg('dbx-key');
  const appSecret = cfg('dbx-secret');
  const params = new URLSearchParams();
  params.append('refresh_token', refresh);
  params.append('grant_type', 'refresh_token');
  params.append('client_id', appKey);
  params.append('client_secret', appSecret);
  const res = await fetch(DBX_AUTH, {
    method: 'POST',
    headers: { 'Content-Type': 'application/x-www-form-urlencoded' },
    body: params.toString()
  });
  if (!res.ok) {
    const err = await res.text();
    throw new Error('トークン更新失敗: ' + res.status + ' ' + err.slice(0, 150));
  }
  const data = await res.json();
  localStorage.setItem('pv_dbx-access', data.access_token);
  localStorage.setItem('pv_dbx-expires', String(Date.now() + (data.expires_in || 14400) * 1000));
  return data.access_token;
}

function loadSettings() {
  const fields = {gemini:'s-gemini', 'dbx-key':'s-dbx-key', 'dbx-secret':'s-dbx-secret'};
  Object.entries(fields).forEach(([k, id]) => {
    const v = localStorage.getItem('pv_'+k);
    if (v && document.getElementById(id)) document.getElementById(id).value = v;
  });
  updateDbxStatus();
}
function saveSettings() {
  localStorage.setItem('pv_gemini', document.getElementById('s-gemini').value);
  localStorage.setItem('pv_dbx-key', document.getElementById('s-dbx-key').value);
  localStorage.setItem('pv_dbx-secret', document.getElementById('s-dbx-secret').value);
  showMsg('s-msg', '✅ 保存しました', 'ok');
  updateDbxStatus();
}
function updateDbxStatus() {
  const refreshToken = localStorage.getItem('pv_dbx-refresh');
  const statusEl = document.getElementById('dbx-status');
  if (statusEl) {
    statusEl.innerHTML = refreshToken
      ? '<span style="color:var(--green)">✅ 連携済み（自動更新）</span>'
      : '<span style="color:var(--muted)">未連携 - 上のボタンをタップして開始</span>';
  }
}
function cfg(k) { return localStorage.getItem('pv_'+k) || ''; }
function toggleSettings() { document.getElementById('settings-panel').classList.toggle('open'); }

function showTab(name, btn) {
  ['scan','collection','search'].forEach(n => document.getElementById('view-'+n).style.display = n===name?'block':'none');
  document.querySelectorAll('.tab').forEach(b => b.classList.remove('active'));
  btn.classList.add('active');
  if (name==='collection') loadCollection();
}

// ===== JSON修復関数（日本語の引用符など破損対応） =====
function tryParseJsonLoose(raw) {
  // 試行1: そのまま
  try { return JSON.parse(raw); } catch(e) {}
  // 試行2: {...}部分のみ
  const s = raw.indexOf('{'), end = raw.lastIndexOf('}');
  if (s < 0 || end <= s) return null;
  let body = raw.slice(s, end+1);
  try { return JSON.parse(body); } catch(e) {}
  // 試行3: マークダウン除去
  body = body.replace(/```json\s*/g, '').replace(/```/g, '');
  try { return JSON.parse(body); } catch(e) {}
  // 試行4: 各キーの値を正規表現で個別抽出（破損JSONからの救出）
  const keys = ['name','type','hp','rarity','set','number','notes','price'];
  const result = {};
  for (const key of keys) {
    // "key":"value" のパターン（値内の "" は許容しない）
    const re = new RegExp('"' + key + '"\\s*:\\s*"([^"]*)"');
    const m = body.match(re);
    if (m) result[key] = m[1];
  }
  if (Object.keys(result).length > 0) return result;
  return null;
}

// ===== モデルフォールバック機能 =====
const GEMINI_MODELS = [
  'gemini-2.5-flash',
  'gemini-2.0-flash',
  'gemini-2.5-flash-lite',
  'gemini-flash-latest'
];

async function callGeminiWithFallback(apiKey, body, maxRetries = 2) {
  let lastError = null;
  for (const model of GEMINI_MODELS) {
    for (let retry = 0; retry <= maxRetries; retry++) {
      try {
        const res = await fetch(
          `https://generativelanguage.googleapis.com/v1beta/models/${model}:generateContent?key=${apiKey}`,
          {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify(body)
          }
        );
        if (res.ok) {
          console.log('Success with model: ' + model);
          return await res.json();
        }
        const errText = await res.text();
        lastError = new Error('API ' + res.status + ': ' + errText.slice(0, 200));
        // 503/429は別モデルを試す、それ以外は即throw
        if (res.status === 503 || res.status === 429) {
          if (retry < maxRetries) {
            await new Promise(r => setTimeout(r, 1500 * (retry + 1)));
            continue;
          }
          break; // 次のモデルへ
        } else {
          throw lastError;
        }
      } catch(e) {
        lastError = e;
        if (retry >= maxRetries) break;
      }
    }
  }
  throw lastError || new Error('全モデルで失敗しました');
}

async function analyze() {
  const apiKey = cfg('gemini');
  if (!apiKey) { showMsg('scan-msg','⚠️ Gemini API Keyを設定してください','err'); toggleSettings(); return; }
  // 複数枚の場合は一括処理に切り替え
  if (selectedFiles.length > 1) {
    return analyzeBatch();
  }
  if (!selectedFile || !selectedB64) return;
  const btn = document.getElementById('btn-analyze');
  btn.disabled = true;
  btn.innerHTML = '<span class="spinner"></span>解析中...';
  showMsg('scan-msg', '🔍 Gemini AIで解析中...', 'info');
  try {
    const mediaType = selectedFile.type || 'image/jpeg';
    const prompt = 'このポケモンカードを分析してください。返答は必ずJSONオブジェクトのみで、説明文・マークダウン・コードブロック記号は一切含めないでください。\n出力形式: {"name":"ポケモン名","type":"fire|water|grass|electric|psychic|fighting|dark|dragon|steel|normal|colorlessのいずれか1つ","hp":"HP数値の文字列","rarity":"レアリティ","set":"収録セット名","number":"カード番号","notes":"特徴を50文字以内で"}';
    const data = await callGeminiWithFallback(apiKey, {
      contents: [{ parts: [
        { inline_data: { mime_type: mediaType, data: selectedB64 } },
        { text: prompt }
      ]}],
      generationConfig: { maxOutputTokens: 2048, temperature: 0.1, responseMimeType: 'application/json' }
    });
    const raw = (data.candidates?.[0]?.content?.parts || []).map(p => p.text||'').join('');
    if (!raw) throw new Error('AIからの応答が空でした');
    const card = tryParseJsonLoose(raw);
    if (!card || !card.name) throw new Error('解析失敗。AI応答: ' + raw.slice(0, 200));
    analyzedCard = { ...card, imageData: selectedB64, imageMime: mediaType, registeredAt: new Date().toISOString() };
    showResult(card);
    showMsg('scan-msg', '✅ 解析完了！価格検索中...', 'info');
    // 価格を別途検索（時間がかかるため非同期）
    searchPrice(card).then(priceInfo => {
      if (priceInfo) {
        analyzedCard.price = priceInfo.price;
        analyzedCard.priceNote = priceInfo.note;
        document.getElementById('r-price').textContent = priceInfo.price ? '¥' + priceInfo.price.toLocaleString() : '価格情報なし';
        document.getElementById('r-price-note').textContent = priceInfo.note || '';
        showMsg('scan-msg', '✅ 解析・価格検索完了！', 'ok');
      } else {
        document.getElementById('r-price').textContent = '取得失敗';
        showMsg('scan-msg', '✅ 解析完了（価格取得失敗）', 'ok');
      }
    }).catch(e => {
      document.getElementById('r-price').textContent = '取得失敗';
      document.getElementById('r-price-note').textContent = e.message;
    });
  } catch(e) {
    showMsg('scan-msg', '❌ ' + e.message, 'err');
  } finally {
    btn.disabled = false;
    btn.innerHTML = '🔍 AIで解析する';
  }
}

async function analyzeOneCard(file, b64, mediaType) {
  const apiKey = cfg('gemini');
  const prompt = 'このポケモンカードを分析してください。返答は必ずJSONオブジェクトのみで、説明文・マークダウン・コードブロック記号は一切含めないでください。\n出力形式: {"name":"ポケモン名","type":"fire|water|grass|electric|psychic|fighting|dark|dragon|steel|normal|colorlessのいずれか1つ","hp":"HP数値の文字列","rarity":"レアリティ","set":"収録セット名","number":"カード番号","notes":"特徴を50文字以内で"}';
  const data = await callGeminiWithFallback(apiKey, {
    contents: [{ parts: [
      { inline_data: { mime_type: mediaType, data: b64 } },
      { text: prompt }
    ]}],
    generationConfig: { maxOutputTokens: 2048, temperature: 0.1, responseMimeType: 'application/json' }
  });

async function analyzeBatch() {
  const files = selectedFiles;
  const btn = document.getElementById('btn-analyze');
  btn.disabled = true;
  const batchBox = document.getElementById('batch-result');
  const batchList = document.getElementById('batch-list');
  batchBox.classList.add('show');
  batchList.innerHTML = '';

  let success = 0, failed = 0;
  for (let i = 0; i < files.length; i++) {
    const file = files[i];
    const status = document.createElement('div');
    status.className = 'batch-item';
    status.innerHTML = `<span class="batch-num">${i+1}/${files.length}</span><span class="batch-name">${file.name}</span><span class="batch-status" style="color:var(--muted)">⏳ 処理中...</span>`;
    batchList.appendChild(status);
    btn.innerHTML = `<span class="spinner"></span>${i+1}/${files.length}枚目を解析中...`;

    try {
      // 画像読み込み
      const b64 = await new Promise((res, rej) => {
        const r = new FileReader();
        r.onload = () => res(r.result.split(',')[1]);
        r.onerror = rej;
        r.readAsDataURL(file);
      });
      const mediaType = file.type || 'image/jpeg';

      // 解析
      const card = await analyzeOneCard(file, b64, mediaType);
      const cardData = { ...card, imageData: b64, imageMime: mediaType, registeredAt: new Date().toISOString() };

      // 価格検索
      status.querySelector('.batch-status').innerHTML = '💰 価格検索中...';
      const priceInfo = await searchPrice(card);
      if (priceInfo && priceInfo.price > 0) {
        cardData.price = priceInfo.price;
        cardData.priceNote = priceInfo.note;
      }

      // Dropbox保存
      status.querySelector('.batch-status').innerHTML = '📦 保存中...';
      const id = 'card_' + Date.now() + '_' + i;
      const bin = atob(b64);
      const arr = new Uint8Array(bin.length);
      for (let j=0;j<bin.length;j++) arr[j]=bin.charCodeAt(j);
      await dbxUpload('/' + id + '.jpg', arr.buffer);
      const meta = {...cardData, id, imagePath: '/' + id + '.jpg'};
      delete meta.imageData;
      delete meta.imageMime;
      await dbxUpload('/' + id + '.json', new Blob([JSON.stringify(meta, null, 2)], {type:'application/json'}));

      status.querySelector('.batch-name').textContent = card.name || file.name;
      status.querySelector('.batch-status').innerHTML = `✅ ${cardData.price ? '¥'+cardData.price.toLocaleString() : '保存済'}`;
      status.querySelector('.batch-status').style.color = 'var(--green)';
      success++;
    } catch(e) {
      status.querySelector('.batch-status').innerHTML = '❌ ' + e.message.slice(0, 30);
      status.querySelector('.batch-status').style.color = 'var(--red)';
      failed++;
    }
  }

  btn.disabled = false;
  btn.innerHTML = '🔍 AIで解析する';
  document.getElementById('total').textContent = parseInt(document.getElementById('total').textContent||0) + success;
  showMsg('scan-msg', `✅ 完了: 成功${success}枚 / 失敗${failed}枚`, success > 0 ? 'ok' : 'err');
  // リセット
  selectedFiles = [];
  selectedFile = null;
  selectedB64 = null;
  document.getElementById('file-input').value = '';
  document.getElementById('drop-icon').style.display = 'block';
  document.getElementById('drop-text').innerHTML = '下のボタンでカードを撮影・選択';
  document.getElementById('preview-img').style.display = 'none';
}

async function searchPrice(card) {
  const apiKey = cfg('gemini');
  if (!apiKey || !card.name) return { price: 0, note: 'API Key未設定' };
  const query = `${card.name} ${card.rarity||''} ${card.number||''} ${card.set||''}`.trim();
  const prompt = `「${query}」というポケモンカードの現在のフリマアプリ・カードショップでの売却参考価格を、メルカリ、カードラッシュ、駿河屋、ヤフオクなどで検索して教えてください。
最後に必ず以下の形式の1行を含めてください（他は自由形式でOK）:
PRICE_RESULT: 中央値の整数(円),参考サイト名や価格帯の補足30文字以内
例: PRICE_RESULT: 1500,メルカリで1200-1800円`;

  // 検索専用にgemini-2.5-flashを直接使う（フォールバックなし、エラー詳細を返す）
  const models = ['gemini-2.5-flash', 'gemini-flash-latest', 'gemini-2.0-flash'];
  let lastErr = '';
  for (const model of models) {
    try {
      const res = await fetch(
        `https://generativelanguage.googleapis.com/v1beta/models/${model}:generateContent?key=${apiKey}`,
        {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({
            contents: [{ parts: [{ text: prompt }] }],
            tools: [{ google_search: {} }],
            generationConfig: { temperature: 0.3 }
          })
        }
      );
      if (!res.ok) {
        const errText = await res.text();
        lastErr = `${model}: ${res.status} ${errText.slice(0, 100)}`;
        continue;
      }
      const data = await res.json();
      const raw = (data.candidates?.[0]?.content?.parts || []).map(p => p.text||'').join('');
      if (!raw) { lastErr = `${model}: 空応答`; continue; }
      // PRICE_RESULT: 1500,メルカリ... の形式を抽出
      const m = raw.match(/PRICE_RESULT:\s*(\d+)\s*,\s*(.+?)(?:\n|$)/);
      if (m) {
        return { price: parseInt(m[1]) || 0, note: m[2].trim().slice(0, 60) };
      }
      // 数値だけでも抽出を試みる
      const numMatch = raw.match(/(\d{2,7})\s*円/);
      if (numMatch) {
        return { price: parseInt(numMatch[1]), note: raw.slice(0, 60).replace(/\n/g, ' ') };
      }
      lastErr = `${model}: 価格抽出失敗 (${raw.slice(0,60)})`;
    } catch(e) {
      lastErr = `${model}: ${e.message}`;
    }
  }
  return { price: 0, note: lastErr || '取得失敗' };
}

async function dbxUpload(path, content) {
  const token = await getDbxAccessToken();
  const res = await fetch(DBX_CONTENT + '/files/upload', {
    method: 'POST',
    headers: {
      'Authorization': 'Bearer ' + token,
      'Dropbox-API-Arg': JSON.stringify({ path: path, mode: 'overwrite', autorename: false, mute: true }),
      'Content-Type': 'application/octet-stream'
    },
    body: content
  });
  if (!res.ok) {
    const err = await res.text();
    throw new Error('アップロード失敗 (' + res.status + '): ' + err.slice(0, 200));
  }
  return await res.json();
}

async function dbxDownload(path) {

    method: 'POST',
    headers: {
      'Authorization': 'Bearer ' + token,
      'Dropbox-API-Arg': JSON.stringify({ path: path })

}

}

function searchCards(q) {
  const el = document.getElementById('search-results');
  if (!q) { el.innerHTML=''; return; }
  const lq = q.toLowerCase();
  renderCards(collection.filter(c=>(c.name||'').toLowerCase().includes(lq)||(c.type||'').toLowerCase().includes(lq)||(c.set||'').toLowerCase().includes(lq)||(c.rarity||'').toLowerCase().includes(lq)), el);
}

async function openModal(id) {
  const c = collection.find(x=>x.id===id); if (!c) return;
  modalCard = c;
  document.getElementById('m-name').textContent = c.name||'不明';
  document.getElementById('m-notes').textContent = c.notes||'';
  document.getElementById('m-date').textContent = c.registeredAt?'登録: '+new Date(c.registeredAt).toLocaleDateString('ja-JP'):'';
  const priceHtml = c.price ? `<div class="rf" style="grid-column:1/-1;background:linear-gradient(135deg,rgba(247,201,72,0.12),rgba(224,92,42,0.12));border:1px solid rgba(247,201,72,0.3)"><div class="rl">💰 参考売却価格</div><div class="rv" style="color:var(--accent);font-size:1.05rem">¥${c.price.toLocaleString()}</div>${c.priceNote?`<div style="font-size:0.65rem;color:var(--muted);margin-top:3px">${c.priceNote}</div>`:''}</div>` : '';
  document.getElementById('m-fields').innerHTML = [
    {l:'タイプ',v:TL[c.type]||c.type||'—'},{l:'HP',v:c.hp?c.hp+' HP':'—'},
    {l:'レアリティ',v:c.rarity||'—'},{l:'カードNo.',v:c.number||'—'}
  ].map(f=>`<div class="rf"><div class="rl">${f.l}</div><div class="rv">${f.v}</div></div>`).join('') + priceHtml;
  document.getElementById('m-img').src='';
  document.getElementById('overlay').classList.add('open');
  if (c.imagePath) {
    try {
      const link = await dbxGetTempLink(c.imagePath);
      if (link) document.getElementById('m-img').src = link;
    } catch{}
  }
}
function closeModal(e) {
  if (!e||e.target.id==='overlay'||e.target.classList.contains('modal-close')) {
    document.getElementById('overlay').classList.remove('open'); modalCard=null;
  }
}
async function deleteCard() {
  if (!modalCard||!confirm(`「${modalCard.name}」を削除しますか？`)) return;
  try {
    await dbxDelete('/' + modalCard.id + '.json');
    if (modalCard.imagePath) await dbxDelete(modalCard.imagePath);
    collection = collection.filter(c=>c.id!==modalCard.id);
    document.getElementById('total').textContent = collection.length;
    closeModal();
    loadCollection();
  } catch(e) { alert('削除失敗: '+e.message); }
}

function showMsg(id, text, type) { const el=document.getElementById(id); el.textContent=text; el.className='msg show '+type; }

loadSettings();
</script>
</body>
</html>
